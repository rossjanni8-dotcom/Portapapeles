name: Build Clipboard AMOLED

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Limpiar proyecto viejo
        run: |
          rm -rf app build.gradle.kts settings.gradle.kts gradle.properties

      - name: Aceptar licencias de Android SDK
        run: |
          sudo mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" | sudo tee $ANDROID_HOME/licenses/android-sdk-license > /dev/null
          echo "84831b9409646a918e30573bab4c9c91346d8abd" | sudo tee $ANDROID_HOME/licenses/android-sdk-preview-license > /dev/null

      - name: Crear archivos de Gradle
        run: |
          mkdir -p app/src/main/java/com/clipboardamoled

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ClipboardAMOLED"
          include(":app")
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.clipboardamoled"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.clipboardamoled"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release { isMinifyEnabled = false }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("com.google.android.material:material:1.12.0")
          }
          EOF

      - name: Crear manifest
        run: |
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <application
                  android:allowBackup="true"
                  android:label="Clipboard AMOLED"
                  android:theme="@style/Theme.MaterialComponents.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".ClipboardService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="clipboard_manager_overlay" />
                  </service>
              </application>
          </manifest>
          EOF

      - name: Crear MainActivity
        run: |
          cat << 'EOF' > app/src/main/java/com/clipboardamoled/MainActivity.kt
          package com.clipboardamoled

          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.res.ColorStateList
          import android.graphics.Color
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import com.google.android.material.button.MaterialButton
          import org.json.JSONArray

          class MainActivity : AppCompatActivity() {

              private lateinit var tvLast: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  handleIntent(intent)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.BLACK)
                      gravity = Gravity.CENTER
                      setPadding(48, 48, 48, 48)
                  }

                  val title = TextView(this).apply {
                      text = "CLIPBOARD\nAMOLED"
                      setTextColor(Color.WHITE)
                      textSize = 28f
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 40)
                      letterSpacing = 0.1f
                  }

                  val subtitle = TextView(this).apply {
                      text = "Burbuja de acceso al historial\nMáximo 10 elementos"
                      setTextColor(Color.parseColor("#AAAAAA"))
                      textSize = 14f
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 60)
                  }

                  tvLast = TextView(this).apply {
                      setTextColor(Color.parseColor("#666666"))
                      textSize = 12f
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 40)
                  }
                  refreshLast()

                  val btnStart = MaterialButton(this).apply {
                      text = "INICIAR BURBUJA"
                      textSize = 18f
                      setTextColor(Color.WHITE)
                      backgroundTintList = ColorStateList.valueOf(Color.parseColor("#222222"))
                      cornerRadius = 24
                      setPadding(80, 40, 80, 40)
                      strokeWidth = 2
                      strokeColor = ColorStateList.valueOf(Color.parseColor("#444444"))
                      setOnClickListener {
                          if (!Settings.canDrawOverlays(this@MainActivity)) {
                              Toast.makeText(this@MainActivity, "Activa 'Mostrar sobre otras apps'", Toast.LENGTH_LONG).show()
                              val intent = Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                              startActivity(intent)
                              return@setOnClickListener
                          }
                          val i = Intent(this@MainActivity, ClipboardService::class.java).apply { action = "START" }
                          if (Build.VERSION.SDK_INT >= 26) startForegroundService(i) else startService(i)
                          Toast.makeText(this@MainActivity, "Burbuja activa - minimizando", Toast.LENGTH_SHORT).show()
                          moveTaskToBack(true)
                      }
                  }

                  val btnHistory = MaterialButton(this).apply {
                      text = "VER HISTORIAL"
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      backgroundTintList = ColorStateList.valueOf(Color.parseColor("#1a4d8c"))
                      cornerRadius = 24
                      setPadding(80, 32, 80, 32)
                      setOnClickListener {
                          showHistoryDialog()
                      }
                  }

                  val btnCerrar = MaterialButton(this).apply {
                      text = "CERRAR SERVICIO"
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      backgroundTintList = ColorStateList.valueOf(Color.parseColor("#8B0000"))
                      cornerRadius = 24
                      setPadding(80, 32, 80, 32)
                      setOnClickListener {
                          val stopIntent = Intent(this@MainActivity, ClipboardService::class.java).apply {
                              action = "STOP"
                          }
                          stopService(stopIntent)
                          Toast.makeText(this@MainActivity, "Servicio cerrado", Toast.LENGTH_SHORT).show()
                          finish()
                      }
                  }

                  val hint = TextView(this).apply {
                      text = "\n\nInstrucciones:\n1. INICIAR BURBUJA\n2. Toca la burbuja flotante para abrir el historial\n3. Al tocar una copia en el historial, se copia y se cierra solo\n4. Arrastra la burbuja donde prefieras"
                      setTextColor(Color.parseColor("#555555"))
                      textSize = 11f
                      gravity = Gravity.CENTER
                  }

                  root.addView(title)
                  root.addView(subtitle)
                  root.addView(tvLast)
                  root.addView(btnStart)
                  root.addView(btnHistory)
                  root.addView(btnCerrar)
                  root.addView(hint)

                  setContentView(root)
              }

              override fun onNewIntent(intent: Intent?) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  if (intent != null) {
                      handleIntent(intent)
                  }
              }

              private fun handleIntent(intent: Intent) {
                  if (intent.action == "SHOW_HISTORY") {
                      window.decorView.post { showHistoryDialog() }
                  }
              }

              private fun getHistoryList(): MutableList<String> {
                  try {
                      val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      val clip = cm.primaryClip
                      if (clip != null && clip.itemCount > 0) {
                          val text = clip.getItemAt(0).text?.toString()
                          if (!text.isNullOrBlank()) {
                              saveToHistoryInternal(text)
                          }
                      }
                  } catch (_: Exception) {}

                  val prefs = getSharedPreferences("clipboard_prefs", MODE_PRIVATE)
                  val jsonStr = prefs.getString("history_json", "[]") ?: "[]"
                  val list = mutableListOf<String>()
                  try {
                      val jsonArray = JSONArray(jsonStr)
                      for (i in 0 until jsonArray.length()) {
                          list.add(jsonArray.getString(i))
                      }
                  } catch (_: Exception) {}
                  return list
              }

              private fun saveToHistoryInternal(text: String) {
                  val prefs = getSharedPreferences("clipboard_prefs", MODE_PRIVATE)
                  val jsonStr = prefs.getString("history_json", "[]") ?: "[]"
                  val list = mutableListOf<String>()
                  try {
                      val jsonArray = JSONArray(jsonStr)
                      for (i in 0 until jsonArray.length()) {
                          list.add(jsonArray.getString(i))
                      }
                  } catch (_: Exception) {}

                  if (list.isNotEmpty() && list[0] == text) return

                  list.add(0, text)
                  while (list.size > 10) {
                      list.removeAt(list.size - 1)
                  }

                  val newArray = JSONArray()
                  list.forEach { newArray.put(it) }

                  prefs.edit()
                      .putString("history_json", newArray.toString())
                      .putString("last", text)
                      .apply()
              }

              private fun getPreview(text: String): String {
                  val words = text.trim().split(Regex("\\s+"))
                  return if (words.size <= 3) {
                      text.trim()
                  } else {
                      "${words[0]} ${words[1]} ${words[2]}..."
                  }
              }

              private fun showHistoryDialog() {
                  val history = getHistoryList()

                  if (history.isEmpty()) {
                      AlertDialog.Builder(this)
                          .setTitle("Historial vacío")
                          .setMessage("Aún no hay textos copiados en el sistema.")
                          .setPositiveButton("OK", null)
                          .show()
                      return
                  }

                  val scrollView = ScrollView(this)
                  val linearLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(32, 16, 32, 16)
                  }

                  // Creamos primero el diálogo para poder cerrarlo al hacer clic en un elemento
                  val dialog = AlertDialog.Builder(this)
                      .setTitle("Historial (${history.size}/10) - Toca para copiar")
                      .setView(scrollView)
                      .setPositiveButton("Cerrar", null)
                      .setNeutralButton("Limpiar historial") { _, _ ->
                          getSharedPreferences("clipboard_prefs", MODE_PRIVATE).edit().remove("history_json").remove("last").apply()
                          Toast.makeText(this, "Historial limpiado", Toast.LENGTH_SHORT).show()
                      }
                      .create()

                  history.forEach { fullText ->
                      val previewText = getPreview(fullText)
                      val tv = TextView(this).apply {
                          text = previewText
                          setTextColor(Color.WHITE)
                          textSize = 14f
                          setPadding(24, 24, 24, 24)
                          setBackgroundColor(Color.parseColor("#1a1a1a"))
                          val lp = LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          ).apply {
                              setMargins(0, 0, 0, 12)
                          }
                          layoutParams = lp
                          setOnClickListener {
                              val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                              cm.setPrimaryClip(ClipData.newPlainText("clip", fullText))
                              Toast.makeText(context, "¡Copiado y menú cerrado!", Toast.LENGTH_SHORT).show()
                              dialog.dismiss() // Se cierra automáticamente aquí
                          }
                      }
                      linearLayout.addView(tv)
                  }

                  scrollView.addView(linearLayout)
                  dialog.show()
              }

              private fun refreshLast() {
                  val last = getSharedPreferences("clipboard_prefs", MODE_PRIVATE).getString("last", "") ?: ""
                  tvLast.text = if (last.isNotEmpty()) "Último: ${getPreview(last)}" else "Sin textos guardados aún"
              }

              override fun onResume() {
                  super.onResume()
                  refreshLast()
              }
          }
          EOF

      - name: Crear ClipboardService
        run: |
          cat << 'EOF' > app/src/main/java/com/clipboardamoled/ClipboardService.kt
          package com.clipboardamoled

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.IBinder
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import androidx.core.app.NotificationCompat
          import org.json.JSONArray

          class ClipboardService : Service() {

              private var wm: WindowManager? = null
              private var floatingBubble: View? = null

              private var initialX = 0
              private var initialY = 0
              private var initialTouchX = 0f
              private var initialTouchY = 0f
              private var isDragging = false

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  startForegroundNotification()
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      "STOP" -> {
                          removeBubble()
                          stopForeground(STOP_FOREGROUND_REMOVE)
                          stopSelf()
                          return START_NOT_STICKY
                      }
                      else -> {
                          showBubble()
                          return START_STICKY
                      }
                  }
              }

              private fun overlayType(): Int =
                  if (Build.VERSION.SDK_INT >= 26) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  else WindowManager.LayoutParams.TYPE_PHONE

              private fun startForegroundNotification() {
                  val channelId = "clipboard_channel"
                  if (Build.VERSION.SDK_INT >= 26) {
                      val channel = NotificationChannel(channelId, "Clipboard AMOLED", NotificationManager.IMPORTANCE_LOW)
                      channel.setShowBadge(false)
                      (getSystemService(NOTIFICATION_SERVICE) as NotificationManager).createNotificationChannel(channel)
                  }
                  val notif: Notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("Clipboard AMOLED activo")
                      .setContentText("Toca la burbuja para abrir el historial.")
                      .setSmallIcon(android.R.drawable.ic_menu_edit)
                      .setOngoing(true)
                      .build()
                  startForeground(1, notif)
              }

              private fun showBubble() {
                  removeBubble()

                  val size = 110
                  val params = WindowManager.LayoutParams(
                      size,
                      size,
                      overlayType(),
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 50
                      y = 300
                  }

                  val bubbleDrawable = GradientDrawable().apply {
                      shape = GradientDrawable.OVAL
                      setColor(Color.parseColor("#15000000"))
                      setStroke(2, Color.parseColor("#888888"))
                  }

                  val bubble = View(this).apply {
                      background = bubbleDrawable
                  }

                  bubble.setOnTouchListener { v, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              initialX = params.x
                              initialY = params.y
                              initialTouchX = event.rawX
                              initialTouchY = event.rawY
                              isDragging = false
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (event.rawX - initialTouchX).toInt()
                              val dy = (event.rawY - initialTouchY).toInt()
                              if (kotlin.math.abs(dx) > 10 || kotlin.math.abs(dy) > 10) {
                                  isDragging = true
                                  params.x = initialX + dx
                                  params.y = initialY + dy
                                  try {
                                      wm?.updateViewLayout(v, params)
                                  } catch (_: Exception) {}
                              }
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (!isDragging) {
                                  captureAndOpenHistory()
                              }
                              isDragging = false
                              true
                          }
                          else -> false
                      }
                  }

                  try {
                      wm?.addView(bubble, params)
                      floatingBubble = bubble
                  } catch (_: Exception) {}
              }

              private fun captureAndOpenHistory() {
                  try {
                      val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      val clip = cm.primaryClip
                      if (clip != null && clip.itemCount > 0) {
                          val text = clip.getItemAt(0).text?.toString()
                          if (!text.isNullOrBlank()) {
                              saveToHistory(text)
                          }
                      }
                  } catch (_: Exception) {}

                  vibrate()
                  openHistoryActivity()
              }

              private fun saveToHistory(text: String) {
                  val prefs = getSharedPreferences("clipboard_prefs", MODE_PRIVATE)
                  val jsonStr = prefs.getString("history_json", "[]") ?: "[]"
                  val list = mutableListOf<String>()
                  try {
                      val jsonArray = JSONArray(jsonStr)
                      for (i in 0 until jsonArray.length()) {
                          list.add(jsonArray.getString(i))
                      }
                  } catch (_: Exception) {}

                  if (list.isNotEmpty() && list[0] == text) return

                  list.add(0, text)
                  while (list.size > 10) {
                      list.removeAt(list.size - 1)
                  }

                  val newArray = JSONArray()
                  list.forEach { newArray.put(it) }

                  prefs.edit()
                      .putString("history_json", newArray.toString())
                      .putString("last", text)
                      .apply()
              }

              private fun openHistoryActivity() {
                  val intent = Intent(this, MainActivity::class.java).apply {
                      action = "SHOW_HISTORY"
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                  }
                  startActivity(intent)
              }

              private fun vibrate() {
                  try {
                      val v = getSystemService(VIBRATOR_SERVICE) as Vibrator
                      if (Build.VERSION.SDK_INT >= 26) {
                          v.vibrate(VibrationEffect.createOneShot(40, VibrationEffect.DEFAULT_AMPLITUDE))
                      } else {
                          @Suppress("DEPRECATION")
                          v.vibrate(40)
                      }
                  } catch (_: Exception) {}
              }

              private fun removeBubble() {
                  try {
                      floatingBubble?.let { wm?.removeView(it) }
                  } catch (_: Exception) {}
                  floatingBubble = null
              }

              override fun onDestroy() {
                  removeBubble()
                  super.onDestroy()
              }
          }
          EOF

      - name: Compilar
        run: |
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Clipboard-AMOLED-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
